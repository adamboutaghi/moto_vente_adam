<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulaire Client | ALIEN MOTO</title>
    <style>
        /* --- Styles de base --- */
        body {
            background: linear-gradient(rgba(0, 3, 57, 0.9), rgba(0, 0, 0, 0.7)), url('acc.jpg');
            background-size: cover;
            background-attachment: fixed;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: center;
            gap: 24px;
            min-height: 100vh;
        }

        /* --- Conteneur Adaptatif (PC & Mobile) --- */
        .form-container {
            width: 100%;
            max-width: 450px; /* Largeur max sur PC */
            background: rgba(255, 255, 255, 0.95);
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
            box-sizing: border-box;
            transition: transform 0.3s ease;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
            color: #000339;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #333;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 16px; /* Évite le zoom automatique sur iPhone */
            transition: border-color 0.3s;
        }

        input:focus {
            border-color: #000679;
            outline: none;
            background-color: #f0f4ff;
        }

        button {
            width: 100%;
            padding: 15px;
            background-color: #000679;
            color: white;
            border: none;
            font-size: 18px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
            margin-top: 10px;
        }

        button:hover {
            background-color: #000339;
            box-shadow: 0 5px 15px rgba(0, 6, 121, 0.4);
            transform: translateY(-2px);
        }

        .submitted-info h2 {
            margin-top: 0;
            color: #000339;
        }

        .submitted-info dl {
            display: grid;
            grid-template-columns: max-content minmax(0, 1fr);
            gap: 12px 16px;
            margin-bottom: 0;
        }

        .submitted-info dt {
            font-weight: bold;
            color: #333;
        }

        .submitted-info dd {
            margin: 0;
            overflow-wrap: anywhere;
            color: #333;
        }

        /* --- Bouton Retour Accueil --- */
        .h {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 50px;
            height: 50px;
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            text-decoration: none;
        }

        .home-icon {
            width: 24px;
            height: 24px;
            filter: invert(1);
        }

        .h:hover {
            background: #000679;
            transform: scale(1.1) rotate(5deg);
        }

        /* --- Media Queries (Ajustements Mobile) --- */
        @media (max-width: 480px) {
            body {
                padding: 10px;
            }
            
            .form-container {
                padding: 25px 20px;
                border-radius: 10px;
                margin-top: 60px; /* Espace pour le bouton retour */
            }

            h1 {
                font-size: 22px;
            }

            .h {
                width: 40px;
                height: 40px;
                top: 10px;
                left: 10px;
            }
        }
    </style>
</head>
<body>
    <!-- Bouton Retour -->
    <a class="h" href="index.html">
        <img src="homelogin.svg" alt="Accueil" class="home-icon">
    </a>

    <div class="form-container">
        <h1>Formulaire Client</h1>
        <form id="client-form" action="#" method="post">
            <div class="form-group">
                <label for="nom">Nom</label>
                <input type="text" id="nom" name="nom" placeholder="Votre nom" required>
            </div>

            <div class="form-group">
                <label for="prenom">Prénom</label>
                <input type="text" id="prenom" name="prenom" placeholder="Votre prénom" required>
            </div>

            <div class="form-group">
                <label for="telephone">Téléphone</label>
                <input type="tel" id="telephone" name="telephone" placeholder="Ex: 0600000000" required>
            </div>

            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="exemple@gmail.com" required>
            </div>

            <div class="form-group">
                <label for="adresse">Adresse</label>
                <input type="text" id="adresse" name="adresse" placeholder="Votre adresse complète" required>
            </div>

            <button type="submit">Envoyer le dossier</button>
        </form>
    </div>

    <section class="form-container submitted-info" id="submitted-info" aria-live="polite" hidden>
        <h2>Dossier envoyé</h2>
        <dl></dl>
    </section>

    <script>
        const form = document.querySelector('#client-form');
        const submittedInfo = document.querySelector('#submitted-info');
        const details = submittedInfo.querySelector('dl');

        form.addEventListener('submit', (event) => {
            event.preventDefault();

            const values = new FormData(form);
            const fields = [
                ['Nom', 'nom'],
                ['Prénom', 'prenom'],
                ['Téléphone', 'telephone'],
                ['Email', 'email'],
                ['Adresse', 'adresse']
            ];

            details.replaceChildren();
            for (const [label, name] of fields) {
                const term = document.createElement('dt');
                const description = document.createElement('dd');
                term.textContent = label;
                description.textContent = values.get(name);
                details.append(term, description);
            }

            submittedInfo.hidden = false;
            submittedInfo.scrollIntoView({ behavior: 'smooth', block: 'start' });
        });
    </script>
</body>
</html>
